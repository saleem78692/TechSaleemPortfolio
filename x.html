<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Mobile Navbar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* ===== Header ===== */
header{
    position: fixed;
    width:100%;
    top:0;
    left:0;
    background:#111;
    color:#fff;
    z-index:1100;
}

nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 25px;
}

.logo h3{
    font-size:22px;
    letter-spacing:2px;
}

/* ===== Hamburger ===== */
.menu-toggle{
    display:none;
    flex-direction:column;
    cursor:pointer;
}

.menu-toggle span{
    width:26px;
    height:3px;
    background:#fff;
    margin:4px 0;
    border-radius:4px;
    transition:0.3s;
}

/* ===== Menu ===== */
.nav-menu{
    display:flex;
    list-style:none;
}

.nav-menu a{
    color:#fff;
    text-decoration:none;
    padding:10px 15px;
    font-size:15px;
    transition:0.3s;
}

.nav-menu a:hover{
    color:#00ffd5;
}

/* ===== Overlay ===== */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transition:0.3s;
    z-index:999;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

/* ===== Mobile Styles ===== */
@media(max-width:1024px){

    .menu-toggle{
        display:flex;
    }

    .nav-menu{
        position:fixed;
        top:0;
        right:-100%;
        width:260px;
        height:100vh;
        background:#1c1c1c;
        flex-direction:column;
        padding:90px 25px;
        transition:0.4s ease;
        z-index:1000;
    }

    .nav-menu.active{
        right:0;
    }

    .nav-menu li{
        margin-bottom:20px;
    }

    .nav-menu a{
        font-size:17px;
        letter-spacing:1px;
    }
}
.close-btn{
    position:absolute;
    top:20px;
    right:20px;
    font-size:32px;
    color:#fff;
    cursor:pointer;
    display:none;
}

@media(max-width:1024px){
    .close-btn{
        display:block;
    }
}

</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <h3>MS</h3>
        </div>

        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-menu" id="navMenu">

            <!-- Close Icon -->
            <div class="close-btn" id="closeBtn">&times;</div>

            <li><a href="#home">Home</a></li>
            <li><a href="#about">About Me</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<div class="overlay" id="overlay"></div>




<script>
const toggle = document.getElementById("menuToggle");
const menu = document.getElementById("navMenu");
const overlay = document.getElementById("overlay");
const closeBtn = document.getElementById("closeBtn");

toggle.addEventListener("click", () => {
    menu.classList.add("active");
    overlay.classList.add("active");
});

closeBtn.addEventListener("click", () => {
    menu.classList.remove("active");
    overlay.classList.remove("active");
});

overlay.addEventListener("click", () => {
    menu.classList.remove("active");
    overlay.classList.remove("active");
});

document.querySelectorAll(".nav-menu a").forEach(link => {
    link.addEventListener("click", () => {
        menu.classList.remove("active");
        overlay.classList.remove("active");
    });
});
</script>


</body>
</html>
